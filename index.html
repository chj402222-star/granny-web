<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2b1d14">
    <title>폐지의 달인</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #2b1d14;
        touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      /* 세로 9:16 게임: PC에서는 화면 높이에 맞춰 가운데, 폰에서는 꽉 채운다 */
      #frame { position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%);
        height: 100%; width: min(100vw, calc(100vh * 9 / 16)); }
      body.mobile #frame { left: 0; transform: none; width: 100%; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #2b1d14; outline: none; }
      #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #ffe9c4; font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: #2b1d14; }
      #loading h1 { font-size: 28px; margin: 0 0 18px; letter-spacing: 1px; }
      #bar { width: 60%; max-width: 280px; height: 14px; border-radius: 7px; background: #4a3424; overflow: hidden; }
      #fill { width: 0%; height: 100%; background: #ffcf4a; transition: width 0.2s; }
      #percent { margin-top: 10px; font-size: 14px; opacity: 0.8; }
      #error { display: none; position: absolute; left: 10%; right: 10%; top: 40%; padding: 16px; border-radius: 12px;
        background: #fff3e0; color: #5a2d12; font-family: sans-serif; font-size: 15px; text-align: center; }
    </style>
  </head>
  <body>
    <div id="frame">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading">
        <h1>폐지의 달인</h1>
        <div id="bar"><div id="fill"></div></div>
        <div id="percent">불러오는 중... 0%</div>
      </div>
      <div id="error"></div>
    </div>
    <script src="Build/Web.loader.js"></script>
    <script>
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isMobile) document.body.classList.add('mobile');
      // 아이폰 화면 밀림·확대 막기
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
      document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

      var fill = document.getElementById('fill');
      var percent = document.getElementById('percent');
      createUnityInstance(document.querySelector('#unity-canvas'), {
        arguments: [],
        dataUrl: "Build/Web.data.unityweb",
        frameworkUrl: "Build/Web.framework.js.unityweb",
        codeUrl: "Build/Web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Playwith",
        productName: "폐지의 달인",
        productVersion: "0.1.0",
        // 고해상도 폰(아이폰 3배)에서 너무 무겁지 않게 2배까지만 그린다
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      }, function (progress) {
        var p = Math.round(progress * 100);
        fill.style.width = p + '%';
        percent.textContent = '불러오는 중... ' + p + '%';
      }).then(function (unityInstance) {
        document.getElementById('loading').style.display = 'none';
        // 탭을 숨기거나(다른 앱·홈 화면) 닫을 때 바로 저장한다(웹에는 앱 일시정지 신호가 없다)
        var save = function () { try { unityInstance.SendMessage('GameRoot', 'SaveNow'); } catch (e) {} };
        document.addEventListener('visibilitychange', function () { if (document.hidden) save(); });
        window.addEventListener('pagehide', save);
      }).catch(function (message) {
        var box = document.getElementById('error');
        box.style.display = 'block';
        box.textContent = '게임을 열지 못했어요. 다른 브라우저(사파리·크롬 최신 버전)로 열어 주세요. (' + message + ')';
      });
    </script>
  </body>
</html>
